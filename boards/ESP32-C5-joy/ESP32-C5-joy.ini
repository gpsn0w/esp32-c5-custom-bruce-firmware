[env:esp32-c5-joy]
board = esp32-c5-devkitc-1
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ESP32-C5-joy>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5-joy
	-DDEVICE_NAME='"ESP32-C5-Joy"'
	-DESP32C5_DEVKITC_1_TFT=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DUSE_FSPI_PORT=1
	-DFP=1
	-DFM=2
	-DFG=3
	-DBTN_ALIAS='"Joy"'
